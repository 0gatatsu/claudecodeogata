name: 諫早市ごみカレンダー更新

on:
  schedule:
    # 毎年4月5日 00:00 UTC（= 9:00 JST）に自動実行
    # 諫早市が新年度PDFを4月初旬に公開するため、5日以降に実行
    - cron: '0 0 5 4 *'
  workflow_dispatch:
    inputs:
      pdf_url:
        description: '諫早市PDFのURL（省略時はデフォルトURL使用）'
        required: false
        default: ''
      year:
        description: '年度の開始年（例: 2026なら2026年4月〜2027年3月）省略時は実行年'
        required: false
        default: ''

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Determine parameters
        id: params
        run: |
          YEAR="${{ github.event.inputs.year }}"
          if [ -z "$YEAR" ]; then
            YEAR=$(date +%Y)
          fi
          echo "year=$YEAR" >> "$GITHUB_OUTPUT"

      - name: Parse calendar PDF
        run: |
          PDF_FILE=$(find calendar_source/ -name "*.pdf" | sort | tail -1)
          if [ -z "$PDF_FILE" ]; then
            echo "エラー: calendar_source/ にPDFファイルが見つかりません。"
            echo "諫早市のサイトからPDFをダウンロードして calendar_source/ に置いてください。"
            echo "URL: https://www.city.isahaya.nagasaki.jp/soshiki/38/1795.html"
            exit 1
          fi
          echo "PDFファイルを使用: $PDF_FILE"
          python scripts/parse_isahaya_garbage.py \
            --pdf-file "$PDF_FILE" \
            --zone "栄田町" \
            --year "${{ steps.params.outputs.year }}" \
            --output-dir docs

      - name: Commit updated calendar files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "変更なし（スキップ）"
          else
            git commit -m "ごみカレンダー更新 $(date +%Y-%m-%d) [skip ci]"
            git push origin HEAD
          fi
